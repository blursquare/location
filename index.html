<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Gestion locative</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🏠</span> Gestion locative</div>
    <div class="top-actions">
      <label class="year">Année
        <select id="annee"></select>
      </label>
      <span id="cloud-etat" class="cloud-etat" hidden></span>
      <button id="verrou" class="secondary" title="Verrouiller">🔒</button>
    </div>
  </header>
  <nav id="nav" class="nav">
    <button data-view="dashboard"><span class="ico" aria-hidden="true">📊</span><span class="lbl">Tableau de bord</span></button>
    <button data-view="biens"><span class="ico" aria-hidden="true">🏠</span><span class="lbl">Biens</span></button>
    <button data-view="baux"><span class="ico" aria-hidden="true">👥</span><span class="lbl">Locataires</span></button>
    <button data-view="loyers"><span class="ico" aria-hidden="true">💶</span><span class="lbl">Loyers</span></button>
    <button data-view="charges"><span class="ico" aria-hidden="true">🧾</span><span class="lbl">Charges</span></button>
    <button data-view="regularisation"><span class="ico" aria-hidden="true">⚖️</span><span class="lbl">Régularisation</span></button>
    <button data-view="prets"><span class="ico" aria-hidden="true">🏦</span><span class="lbl">Prêts</span></button>
    <button data-view="contacts"><span class="ico" aria-hidden="true">📇</span><span class="lbl">Contacts</span></button>
    <button data-view="gmail"><span class="ico" aria-hidden="true">✉️</span><span class="lbl">Import Gmail</span></button>
    <button data-view="fiscalite"><span class="ico" aria-hidden="true">🧮</span><span class="lbl">Fiscalité</span></button>
    <button data-view="parametres"><span class="ico" aria-hidden="true">⚙️</span><span class="lbl">Paramètres</span></button>
  </nav>
  <main id="view" class="view"></main>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="actions">
        <button type="button" class="secondary" id="modal-cancel">Annuler</button>
        <button type="submit" id="modal-ok">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="assets/coffre.js"></script>
  <script src="assets/calc.js"></script>
  <script src="assets/annuaire.js"></script>
  <script src="assets/extract.js"></script>
  <script src="assets/gmail.js"></script>
  <script src="assets/cloud.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
